name: Core Reactor CI

on:
  pull_request:
    branches: [main]
    paths:
      - "core-reactor/**"
      - ".github/workflows/core-reactor-ci.yml"
  push:
    branches: [main]
    paths:
      - "core-reactor/**"

jobs:
  test:
    name: Build & Test (Kotlin)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: openex
          POSTGRES_PASSWORD: openex_test_password
          POSTGRES_DB: openex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openex -d openex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./core-reactor

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('core-reactor/**/*.gradle*') }}

      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openex_test
          SPRING_DATASOURCE_USERNAME: openex
          SPRING_DATASOURCE_PASSWORD: openex_test_password
          OPENEX_JWT_SECRET: ci-only-secret-at-least-32-bytes-long-value
        run: gradle test --no-daemon

      - name: Build jar
        run: gradle bootJar --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core-reactor/build/reports/tests/test
