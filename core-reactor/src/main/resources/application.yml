spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openex}
    username: ${SPRING_DATASOURCE_USERNAME:openex}
    password: ${SPRING_DATASOURCE_PASSWORD:openex_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, not Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

openex:
  jwt:
    # Dev-only fallback. In production, OPENEX_JWT_SECRET MUST be set to a
    # real random secret (Render's "Generate" button on env vars works well)
    # — never deploy with this default value.
    secret: ${OPENEX_JWT_SECRET:dev-only-change-me-this-must-be-at-least-32-bytes-long}
    expiration-minutes: 60
  cors:
    # Comma-separated allowed frontend origins. Set via Render env var
    # FRONTEND_ORIGINS to the deployed frontend's real URL in production.
    allowed-origins: ${FRONTEND_ORIGINS:http://localhost:5173}

logging:
  level:
    com.openex: INFO
