spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openex}
    username: ${SPRING_DATASOURCE_USERNAME:openex}
    password: ${SPRING_DATASOURCE_PASSWORD:openex_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema, not Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

openex:
  jwt:
    # Dev-only secret. Override via OPENEX_JWT_SECRET env var for anything real.
    secret: ${OPENEX_JWT_SECRET:dev-only-change-me-this-must-be-at-least-32-bytes-long}
    expiration-minutes: 60

logging:
  level:
    com.openex: INFO
