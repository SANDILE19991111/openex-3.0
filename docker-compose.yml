services:
  vault:
    image: postgres:16
    container_name: openex-vault
    restart: unless-stopped
    environment:
      POSTGRES_USER: openex
      POSTGRES_PASSWORD: openex_dev_password
      POSTGRES_DB: openex
    ports:
      - "5432:5432"
    volumes:
      - openex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openex -d openex"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: openex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  core-reactor:
    build:
      context: ./core-reactor
    container_name: openex-core-reactor
    restart: unless-stopped
    depends_on:
      vault:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://vault:5432/openex
      SPRING_DATASOURCE_USERNAME: openex
      SPRING_DATASOURCE_PASSWORD: openex_dev_password
      OPENEX_JWT_SECRET: dev-only-change-me-this-must-be-at-least-32-bytes-long
      FRONTEND_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  ollama:
    build:
      context: ./ollama
    container_name: openex-ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: llama3.2:1b
    ports:
      - "11434:11434"
    volumes:
      - openex_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 300s

  astromech:
    build:
      context: ./astromech
    container_name: openex-astromech
    restart: unless-stopped
    depends_on:
      core-reactor:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      PORT: 5001
      KOTLIN_API_BASE: http://core-reactor:8080
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      FRONTEND_ORIGINS: http://localhost:5173
    ports:
      - "5001:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./holonet-ui
      args:
        VITE_API_BASE: http://localhost:8080/api
        VITE_WS_BASE: http://localhost:8080/ws
        VITE_DROID_BASE: http://localhost:5001/api
    container_name: openex-frontend
    restart: unless-stopped
    depends_on:
      core-reactor:
        condition: service_healthy
      astromech:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  openex_pgdata:
  openex_ollama_models:
