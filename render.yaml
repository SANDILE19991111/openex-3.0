# Render Blueprint - deploys 4 services now. Ollama is deliberately left
# out of this pass (it's the slowest/most expensive/least stable piece) -
# the chat feature will show "AI assistant unavailable" via the existing
# error handling in app.py, without affecting anything else. Add an
# `openex-ollama` pserv back in later and update OLLAMA_BASE_URL once the
# chat feature itself is working reliably.

databases:
  - name: openex-db
    databaseName: openex
    user: openex
    plan: free

services:
  - type: web
    name: openex-core-reactor
    runtime: docker
    dockerContext: ./core-reactor
    dockerfilePath: ./core-reactor/Dockerfile
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: openex-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: openex-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: openex-db
          property: password
      - key: OPENEX_JWT_SECRET
        generateValue: true
      # Fill in after first deploy with the real frontend URL.
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173

  - type: web
    name: openex-astromech
    runtime: docker
    dockerContext: ./astromech
    dockerfilePath: ./astromech/Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      # Fill in after first deploy with the real backend URL.
      - key: KOTLIN_API_BASE
        value: http://localhost:8080
      # No Ollama deployed yet - chat calls will fail and return the
      # existing "AI assistant unavailable" 503 response, gracefully.
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: OLLAMA_MODEL
        value: llama3.2:1b
      - key: FRONTEND_ORIGINS
        value: http://localhost:5173

  - type: web
    name: openex-frontend
    runtime: static
    buildCommand: cd holonet-ui && npm install && npm run build
    staticPublishPath: ./holonet-ui/dist
    envVars:
      # Fill in after the backend + astromech services exist, with their
      # real URLs, e.g. https://openex-core-reactor.onrender.com
      - key: VITE_API_BASE
        value: http://localhost:8080/api
      - key: VITE_WS_BASE
        value: http://localhost:8080/ws
      - key: VITE_DROID_BASE
        value: http://localhost:5001/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
